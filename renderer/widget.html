<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>업무알리미</title>
<style>
  /* 외부 웹폰트(구글 폰트) 대신 윈도우 내장 글꼴을 사용합니다.
     병원 등 외부 인터넷이 제한된 환경에서도 항상 즉시 로딩되도록 하기 위함입니다. */

  :root{
    --bg: #0a0f1a;
    --panel: #111a2b;
    --panel-2: #16213a;
    --line: #223252;
    --teal: #2dd4bf;
    --amber: #f5a623;
    --red: #ff5a6a;
    --text: #e7edf7;
    --muted: #7d8bab;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color:var(--text);
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .widget{
    flex:1;
    background:var(--panel);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .clockhead{
    padding:20px 20px 16px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .dateline{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .dateline .date{ font-size:14px; color:var(--muted); letter-spacing:0.5px; }
  .headright{ display:flex; gap:6px; align-items:center; }
  #pinBtn{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px;
    cursor:pointer; letter-spacing:0.3px;
  }
  #pinBtn.on{ background:rgba(45,212,191,0.12); border-color:var(--teal); color:var(--teal); }
  .shiftbadge{
    font-size:11px; font-weight:700; color:var(--teal);
    border:1px solid rgba(45,212,191,0.4); background:rgba(45,212,191,0.08);
    padding:3px 9px; border-radius:20px; letter-spacing:0.5px;
  }
  .clock{
    font-family:'Consolas','Courier New',monospace; font-size:48px; font-weight:700;
    font-variant-numeric: tabular-nums; letter-spacing:1px; line-height:1;
    text-shadow:0 0 24px rgba(45,212,191,0.15);
  }
  .clock .sec{ color:var(--teal); font-size:26px; margin-left:4px; }
  .nextswitch{ font-size:11px; color:var(--muted); margin-top:6px; }

  .actionbar{
    display:flex; gap:8px; padding:10px 20px; border-bottom:1px solid var(--line);
    background:var(--panel); flex-shrink:0;
  }
  .actionbar button{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    padding:8px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .actionbar button:hover{ border-color:var(--red); color:var(--red); }

  .timeline{ flex:1; overflow-y:auto; padding:14px 20px 20px; position:relative; }
  .timeline::before{
    content:''; position:absolute; left:50px; top:14px; bottom:14px; width:2px; background:var(--line);
  }
  .empty{ color:var(--muted); font-size:13px; text-align:center; padding:40px 0; }
  .task{ position:relative; display:flex; gap:14px; padding:9px 0; align-items:flex-start; }
  .task .time{
    width:50px; flex-shrink:0; font-family:'Consolas','Courier New',monospace;
    font-size:14px; font-weight:700; color:var(--muted); padding-top:8px; position:relative; z-index:1;
  }
  .task .dot{
    position:absolute; left:46px; top:13px; width:10px; height:10px; border-radius:50%;
    background:var(--line); border:2px solid var(--panel); z-index:2;
  }
  .task .body{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; display:flex; align-items:center; gap:8px;
  }
  .task .checkbtn{
    background:none; border:1.5px solid var(--muted); color:transparent; width:15px; height:15px;
    border-radius:4px; cursor:pointer; flex-shrink:0; font-size:10px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .task .checkbtn:hover{ border-color:var(--teal); }
  .task.done .checkbtn{ background:var(--teal); border-color:var(--teal); color:#06251f; }
  .task .memo-input{
    flex:1; background:transparent; border:none; color:var(--text); font-size:15px;
    font-weight:700; line-height:1.4; font-family:'Segoe UI','Malgun Gothic',sans-serif; padding:2px 0;
  }
  .task .memo-input::placeholder{ color:var(--muted); font-weight:400; }
  .task .memo-input:focus{ outline:none; }
  .task .bellbtn{ background:none; border:none; cursor:pointer; font-size:15px; flex-shrink:0; opacity:0.3; filter:grayscale(1); }
  .task .bellbtn.on{ opacity:1; filter:none; }
  .task .del{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; flex-shrink:0; }
  .task .del:hover{ color:var(--red); }

  .task.upcoming .time{ color:var(--amber); }
  .task.upcoming .dot{ background:var(--amber); box-shadow:0 0 0 4px rgba(245,166,35,0.15); }
  .task.upcoming .body{ border-color:rgba(245,166,35,0.5); background:rgba(245,166,35,0.09); }
  .task.now .time{ color:var(--red); }
  .task.now .dot{ background:var(--red); box-shadow:0 0 0 6px rgba(255,90,106,0.2); animation:pulse 1.2s infinite; }
  .task.now .body{ border-color:var(--red); background:rgba(255,90,106,0.06); }
  .task.done .memo-input{ text-decoration:line-through; color:var(--muted); }
  .task.done .dot{ background:var(--teal); }
  .task.done .body{ opacity:0.55; }

  .task.recur .time{ color:#c084fc; }
  .task.recur .dot{ background:#c084fc; box-shadow:0 0 0 4px rgba(192,132,252,0.2); }
  .task.recur .body{ border-color:rgba(192,132,252,0.5); background:rgba(192,132,252,0.1); }
  .task.recur .rtag{
    font-size:10px; font-weight:800; color:#c084fc; background:rgba(192,132,252,0.15);
    border:1px solid rgba(192,132,252,0.4); border-radius:6px; padding:2px 6px; flex-shrink:0;
  }
  .task.recur .rmemoDisplay{ flex:1; font-size:15px; font-weight:700; color:var(--text); }
  .task.recur.now .time{ color:var(--red); }
  .task.recur.now .dot{ background:var(--red); box-shadow:0 0 0 6px rgba(255,90,106,0.2); animation:pulse 1.2s infinite; }
  .task.recur.now .body{ border-color:var(--red); background:rgba(255,90,106,0.08); }

  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 6px rgba(255,90,106,0.2); }
    50%{ box-shadow:0 0 0 10px rgba(255,90,106,0.05); }
  }

  .addtimebar{
    display:flex; flex-direction:column; gap:8px; padding:14px 20px;
    border-top:1px solid var(--line); background:var(--panel-2); flex-shrink:0;
  }
  .addtimebar .rowlabel{ font-size:11px; color:var(--muted); font-weight:600; letter-spacing:0.3px; }
  .addtimebar .row{ display:flex; gap:8px; }
  .timeinputwrap{ position:relative; width:120px; flex-shrink:0; }
  .timeinputwrap input[type=text]{
    width:100%; background:var(--bg); border:1.5px solid var(--line); color:var(--text);
    border-radius:8px; padding:10px 36px 10px 12px; font-family:'Consolas','Courier New',monospace;
    font-size:16px; font-weight:700; letter-spacing:1px;
  }
  .timeinputwrap input[type=text]:focus{ outline:none; border-color:var(--teal); }
  .timeinputwrap input[type=text]::placeholder{ color:var(--muted); font-size:12px; letter-spacing:0; font-weight:500; }
  .timeinputwrap .clockbtn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:17px; padding:4px;
  }
  .timeinputwrap .clockbtn:hover{ color:var(--teal); }
  .timeinputwrap input[type=time]{
    position:absolute; inset:0; opacity:0; pointer-events:none; width:100%; height:100%;
  }
  .addtimebar button.addbtn{
    flex:1; background:var(--teal); color:#06251f; border:none; border-radius:8px;
    padding:0 16px; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .addtimebar button.addbtn:hover{ filter:brightness(1.08); }

  .brandbar{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:8px 16px 10px; background:var(--panel); flex-shrink:0;
  }
  .brandbar .bloglink{
    font-size:11px; color:var(--teal); text-decoration:none; opacity:0.8; cursor:pointer;
    background:none; border:none; font-family:inherit; padding:0;
  }
  .brandbar .bloglink:hover{ opacity:1; text-decoration:underline; }
  .brandbar .brandright{ display:flex; align-items:center; gap:6px; opacity:0.85; cursor:pointer; }
  .brandbar .brandright:hover{ opacity:1; }
  .brandbar img{ width:26px; height:26px; border-radius:6px; object-fit:cover; }
  .brandbar span{ font-size:13px; letter-spacing:0.3px; color:var(--text); font-weight:700; }

  .overlay{
    position:fixed; inset:0; background:rgba(5,8,15,0.82); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:999;
  }
  .overlay.show{ display:flex; }
  .confirmbox{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:32px 36px; text-align:center; width:340px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .confirmbox .label{ color:var(--amber); font-weight:700; font-size:13px; letter-spacing:2px; margin-bottom:10px; }
  .confirmbox .msg{ font-size:15px; line-height:1.6; margin-bottom:22px; white-space:pre-line; }
  .confirmbox .btnrow{ display:flex; gap:10px; }
  .confirmbox button{
    flex:1; border:none; padding:11px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .confirmbox .cancelbtn{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); }
  .confirmbox .yesbtn{ background:var(--red); color:#fff; }

  .dowchip{
    flex:1; background:var(--panel-2); border:1.5px solid var(--line); color:var(--muted);
    padding:7px 0; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .dowchip.on{ background:rgba(45,212,191,0.15); border-color:var(--teal); color:var(--teal); }
  .dowchip.everyday{ flex:1.3; }
  .dowchip.everyday.on{ background:rgba(245,166,35,0.15); border-color:var(--amber); color:var(--amber); }

  .recuritem{
    display:flex; align-items:center; gap:8px; padding:8px 0;
    border-bottom:1px solid var(--line); font-size:12.5px;
  }
  .recuritem .rtime{ font-family:'Consolas','Courier New',monospace; font-weight:700; color:var(--teal); flex-shrink:0; }
  .recuritem .rdays{ color:var(--amber); font-size:11px; flex-shrink:0; }
  .recuritem .rmemo{ flex:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recuritem .rdel{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; }
  .recuritem .rdel:hover{ color:var(--red); }
  .recur-empty{ color:var(--muted); font-size:12px; text-align:center; padding:12px 0; }

  #toastEl{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:#16213a; border:1px solid #2dd4bf; color:#e7edf7; padding:9px 18px;
    border-radius:20px; font-size:12.5px; font-weight:600; z-index:1000;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); opacity:0; transition:opacity 0.2s; pointer-events:none;
  }
</style>
</head>
<body>

<div class="widget">
  <div class="clockhead">
    <div class="dateline">
      <span class="date" id="dateStr">-</span>
      <div class="headright">
        <button id="pinBtn" onclick="togglePin()" title="항상 위 고정 켜기/끄기">📌 고정 꺼짐</button>
        <span class="shiftbadge">상근직</span>
      </div>
    </div>
    <div class="clock"><span id="hm">--:--</span><span class="sec" id="ss">--</span></div>
    <div class="nextswitch">매일 자정(00시)에 자동 초기화됩니다 (반복 알람은 유지)</div>
  </div>

  <div class="actionbar">
    <button onclick="clearAll()">🔄 초기화</button>
    <button onclick="openRecurring()">🔁 반복 알람</button>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="addtimebar">
    <span class="rowlabel">시간 직접 추가 (24시간제, 예: 2230 → 22:30)</span>
    <div class="row">
      <div class="timeinputwrap">
        <input type="text" id="inTimeText" inputmode="numeric" maxlength="5" placeholder="HH:MM">
        <button type="button" class="clockbtn" onclick="openTimePicker()" title="시계로 선택">🕐</button>
        <input type="time" id="inTimeHidden" tabindex="-1">
      </div>
      <button class="addbtn" onclick="addTimeSlot()">+ 이 시간 추가하기</button>
    </div>
  </div>

  <div class="brandbar">
    <button class="bloglink" onclick="openBlog()">bedsidelab.blogspot.com</button>
    <div class="brandright" onclick="openAbout()" title="프로그램 정보 보기">
      <img src="assets/logo.png" alt="logo">
      <span>Bedside Lab</span>
    </div>
  </div>
</div>

<div class="overlay" id="aboutOverlay">
  <div class="confirmbox" style="text-align:center;">
    <img src="assets/logo.png" alt="logo" style="width:88px;height:88px;border-radius:16px;object-fit:cover;margin-bottom:14px;">
    <div style="font-size:17px;font-weight:700;margin-bottom:2px;">업무알리미</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Clinical Leadership · Healthcare Quality · Operational Innovation</div>
    <div style="font-size:12.5px;color:var(--text);margin-bottom:4px;">Version <span id="aboutVersion">-</span></div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:22px;">© 2026 Bedside Lab. All rights reserved.</div>
    <button class="yesbtn" style="width:100%;background:var(--teal);color:#06251f;" onclick="closeAbout()">닫기</button>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="confirmbox">
    <div class="label">⚠ 확인</div>
    <div class="msg" id="confirmMsg">정말 초기화할까요?</div>
    <div class="btnrow">
      <button class="cancelbtn" onclick="closeConfirm()">취소</button>
      <button class="yesbtn" id="confirmYesBtn">초기화</button>
    </div>
  </div>
</div>

<div class="overlay" id="recurringOverlay">
  <div class="confirmbox" style="width:340px;text-align:left;">
    <div class="label" style="color:var(--teal);">🔁 반복 알람</div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:12px;">
      선택한 요일마다, 근무조 시간표와 상관없이 매주 반복해서 알람이 울려요.
    </div>

    <div id="recurringList" style="max-height:180px;overflow-y:auto;margin-bottom:14px;"></div>

    <div style="border-top:1px solid var(--line);padding-top:12px;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">요일 선택</div>
      <div id="dowPicker" style="display:flex;gap:4px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input type="text" id="recurTimeText" inputmode="numeric" maxlength="5" placeholder="HH:MM"
               style="width:76px;background:var(--bg);border:1.5px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-family:'Consolas','Courier New',monospace;font-size:14px;font-weight:700;">
        <input type="text" id="recurMemoText" placeholder="예: 주간 회의 준비"
               style="flex:1;background:var(--bg);border:1.5px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;">
      </div>
      <button onclick="addRecurring()" style="width:100%;background:var(--teal);color:#06251f;border:none;border-radius:8px;padding:10px;font-weight:700;font-size:13px;cursor:pointer;">+ 반복 알람 추가</button>
    </div>

    <button class="cancelbtn" onclick="closeRecurring()" style="width:100%;margin-top:10px;">닫기</button>
  </div>
</div>

<script src="widget.js"></script>
</body>
</html>
