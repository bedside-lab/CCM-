<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>알림</title>
<style>
  /* 외부 웹폰트 대신 윈도우 내장 글꼴 사용 (인터넷 제한 환경 대응) */
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    background:#111a2b;
    color:#e7edf7;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-app-region: drag;
    border:2px solid #ff5a6a;
    border-radius:14px;
    overflow:hidden;
  }
  .box{ text-align:center; padding:30px; -webkit-app-region: no-drag; }
  .label{ color:#ff5a6a; font-weight:700; font-size:13px; letter-spacing:2px; margin-bottom:10px; }
  .time{ font-family:'Consolas','Courier New',monospace; font-size:40px; font-weight:700; margin-bottom:12px; }
  .memo{
    font-size:26px; font-weight:800; line-height:1.4; margin-bottom:24px; word-break:keep-all;
    color:#f5ff2e;
    text-shadow: 0 0 12px rgba(245,255,46,0.55), 0 2px 4px rgba(0,0,0,0.4);
  }
  button{
    background:#ff5a6a; color:#fff; border:none; padding:12px 30px; border-radius:10px;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  button:hover{ filter:brightness(1.1); }
</style>
</head>
<body>
  <div class="box">
    <div class="label">⏰ 알림 시간입니다</div>
    <div class="time" id="alarmTime">--:--</div>
    <div class="memo" id="alarmMemo"></div>
    <button onclick="window.electronAPI.closeAlarm()">확인</button>
  </div>
<script>
  window.electronAPI.onAlarmData((data) => {
    document.getElementById('alarmTime').textContent = data.time;
    document.getElementById('alarmMemo').textContent = data.memo;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 3; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.connect(gain); gain.connect(ctx.destination);
        const start = ctx.currentTime + i * 0.35;
        osc.start(start);
        osc.stop(start + 0.2);
      }
    } catch (e) {}
  });
</script>
</body>
</html>
