name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 패키지 설치
        run: npm install

      - name: 설치파일(.exe) 빌드
        run: npm run dist

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: BedsideLab-ShiftAlert-Installer
          path: dist/*.exe
